openapi: 3.2.0
info:
  title: FarmCommand Token Login API
  termsOfService: https://www.farmcommand.com/terms-of-service
  contact:
    name: Product Support
    email: productsupport@farmersedge.ca
  version: ''
servers:
- url: https://admin.farmcommand.com/
security:
- FarmCommand Token: []
tags:
- name: token-login
paths:
  /token-login/:
    parameters: []
    post:
      operationId: token-login_create
      description: Token login for FarmCommand users, returns token if logged in successfully
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                required:
                - password
                - username
                type: object
                properties:
                  username:
                    type: string
                  password:
                    type: string
      tags:
      - token-login
      requestBody:
        content:
          application/json:
            schema:
              required:
              - password
              - username
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
        required: true
      summary: Token login create
      x-summary-source: derived
components:
  securitySchemes:
    FarmCommand_Token:
      type: apiKey
      name: token
      in: query
