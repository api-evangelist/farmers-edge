    - last_name
    - email
    - company_name
    - phone
    - postal_or_zip_code
    - country
    - client_type
    type: object
    properties:
      id:
        title: Id
        type: integer
        readOnly: true
      user:
        title: User
        type: integer
      username:
        title: Username
        type: string
        minLength: 1
      password:
        title: Password
        type: string
        minLength: 1
      first_name:
        title: First name
        type: string
        minLength: 1
      last_name:
        title: Last name
        type: string
        minLength: 1
      email:
        title: Email
        type: string
