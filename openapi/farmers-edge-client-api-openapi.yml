      eula_version:
        title: Eula version
        type: string
        format: date
        x-nullable: true
      eula_date_signed:
        title: Eula date signed
        type: string
        format: date-time
        readOnly: true
      crm_id:
        title: Crm id
        type: string
      created_datetime:
        title: Created datetime
        type: string
        format: date-time
        readOnly: true
      updated_datetime:
        title: Updated datetime
        type: string
        format: date-time
        readOnly: true
      client:
        title: Client
        type: integer
        x-nullable: true
      service_offering:
        title: Service offering
        type: integer
        readOnly: true
      created_by:
        title: Created by
        type: integer
        readOnly: true
      last_updated_by:
        title: Last updated by
        type: integer
        readOnly: true
