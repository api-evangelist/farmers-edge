    - email
    - first_name
    - last_name
    - company_name
    - phone
    - postal_or_zip_code
    - country
    - client_type
    - user
    type: object
    properties:
      id:
        title: ID
        type: integer
        readOnly: true
      username:
        title: Username
        type: string
        minLength: 1
      email:
        title: Email
        type: string
        format: email
        minLength: 1
      first_name:
        title: First name
        type: string
        minLength: 1
      last_name:
        title: Last name
        type: string
        minLength: 1
      company_name:
        title: Company name
        type: string
        maxLength: 100
        minLength: 1
      partner:
        title: Partner
        type: string
        enum:
        - nsp
        x-nullable: true
      phone:
        title: Phone
        type: string
        maxLength: 15
        minLength: 1
      address_line1:
        title: Address line1
        type: string
        maxLength: 500
        x-nullable: true
      address_line2:
        title: Address line2
        type: string
        maxLength: 500
        x-nullable: true
      city:
        title: City
        type: string
        maxLength: 120
        x-nullable: true
      province_state:
        title: Province state
        type: string
        maxLength: 100
        x-nullable: true
      postal_or_zip_code:
        title: Postal or zip code
        type: string
        maxLength: 25
        minLength: 1
      country:
        title: Country
        type: string
        enum:
        - Canada
