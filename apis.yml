name: Farmers Edge
description: 'Farmers Edge is a precision-agriculture and digital-farming company whose FarmCommand
  platform combines satellite imagery, connected weather stations, in-field telematics (the CanPlug
  IoT device), agronomic modeling, carbon-program tooling, and soil/lab products such as LabCommand
  and Hefty/FESoils. The public FarmCommand API is a Django REST (drf-yasg) service on
  admin.farmcommand.com that handles self-serve client onboarding and verification, token-based login
  for FarmCommand, LabCommand, GridCalc, RecEngine and Hefty users, password resets, CanPlug device
  lookup, and inbound integration webhooks (Stripe billing, DocuSign envelopes, LEAF field alerts).
  Authentication is a FarmCommand API token passed as a query parameter.'
