        - nsp
        x-nullable: true
      phone:
        title: Phone
        type: string
        maxLength: 15
        minLength: 1
      address_line1:
        title: Address line1
        type: string
        maxLength: 500
        x-nullable: true
      address_line2:
        title: Address line2
        type: string
        maxLength: 500
        x-nullable: true
      city:
        title: City
        type: string
        maxLength: 120
        x-nullable: true
      province_state:
        title: Province state
        type: string
        maxLength: 100
        x-nullable: true
      postal_or_zip_code:
        title: Postal or zip code
        type: string
        maxLength: 25
        minLength: 1
      country:
        title: Country
        type: string
        enum:
        - Canada
        - USA
        - Brazil
      verified:
        title: Verified
        type: boolean
      last_verification_email_sent:
        title: Last verification email sent
        type: string
        format: date-time
        readOnly: true
      client_type:
        title: Client type
        type: string
        enum:
        - Grower
        - Retailer
      payment_session_id:
        title: Payment session id
        type: string
        readOnly: true
        minLength: 1
      client_secret:
